[project]
name = "telegram-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents send Telegram messages and files via a bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.scripts]
telegram-mcp = "telegram_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".env*", "uv.lock"]
include = ["src", "tests", "README.md", "pyproject.toml", ".env.example"]
