[project]
name = "mcp-server-telegram-bot"
version = "0.3.0"
description = "MCP server that lets AI agents send Telegram messages and files via a bot"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mirmaxamat" }]
keywords = ["mcp", "telegram", "bot", "claude"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "fpdf2>=2.8.9",
]

[project.scripts]
mcp-server-telegram-bot = "telegram_mcp.server:main"

[project.urls]
Homepage = "https://github.com/mirmakhamat/mcp-server-telegram-bot"
Issues = "https://github.com/mirmakhamat/mcp-server-telegram-bot/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".env*", "uv.lock"]
include = ["src", "tests", "README.md", "pyproject.toml", ".env.example"]
